Status: Ready
Title: BBBP model tested on marine-derived kinase inhibitors
Description: Judges whether a compound is likely to reach the brain, developed by
  Plisson and Piggott to triage marine-derived kinase inhibitors as candidates for
  neurodegenerative disease. Random forest, gradient boosting and logistic regression
  classifiers were fitted to a training set of 332 previously reported small molecules,
  reaching 80 to 82% cross-validated accuracy, then applied to 471 marine natural
  products with reported kinase inhibition, of which 13 were predicted to cross the
  barrier. Ersilia distributes a replicated implementation; those 13 predictions were
  never tested experimentally.
