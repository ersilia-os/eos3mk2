Status: Ready
Title: BBBP model tested on marine-derived kinase inhibitors
Description: Judges whether a compound is likely to reach the brain, developed by
  Plisson specifically to triage marine-derived kinase inhibitors as candidates for
  neurodegenerative disease. Ensemble classifiers were trained on curated blood-brain
  barrier permeability data and then applied prospectively to a marine natural product
  library, surfacing several hits worth pursuing. Ersilia distributes a replicated
  implementation. Marine natural products occupy chemical space sparsely represented
  in the training data, which is precisely why the authors tested there.
